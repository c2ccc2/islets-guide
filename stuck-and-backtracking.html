(function(){const stages={start:['诺斯特布尔','NorthStable Island','完成教学并击败墓地爬行者，取得二段跳。','Finish the tutorial and defeat Grave Crawler for Double Jump.','walkthrough.html#step-1-1'],hub:['天空之城','Sky City','检查新航线、商店和邮件，再前往已经开放的岛屿。','Check new routes, shops and mail, then fly to an available island.','walkthrough.html#step-1-2'],inverness:['因弗尼斯','Inverness Island','探索墓穴遗迹，击败千魂之墓并取得下砸。','Explore Tomb Ruins, defeat Tomb of 1000 Spirits and obtain Slam.','walkthrough.html#step-2-1'],wolfpine:['沃夫派因','Wolfpine Island','推进灵魂之地区域，寻找磁力核心和埋葬怪兽。','Progress through Spirits Landing toward its core and Buried Beast.','walkthrough.html#step-2-2'],eastwright:['伊斯莱特','Eastwright Island','探索钟表工坊并完成岛屿核心路线。','Explore ClockWorks and complete the island-core route.','walkthrough.html#step-3-1'],cinder:['辛德岛','Cinder Island','检查雨原、空中花园和被遗忘的腐地，准备终局封印。','Check Rainy Plains, Hanging Gardens and Forgotten Rots, then prepare the endgame seals.','walkthrough.html#step-4-1'],ending:['终局','Endgame','确认骨魔像与污秽虫相关封印，然后前往最终战。','Clear the BoneGolem and FilthPest seals, then head to the final battle.','walkthrough.html#step-5-1']};const problems={route:['找不到下一条主线路','Cannot find the next story route','先检查地图上未探索出口；岛屿连接后，旧区域边缘可能出现新通路。','Check unexplored exits. Island fusion can open new passages at old area boundaries.','walkthrough.html'],ledge:['高台或宽坑过不去','High ledge or wide gap','需要二段跳；如果已经取得，第二跳不要按得过早。','Requires Double Jump. If acquired, avoid using the second jump too early.','abilities.html#double-jump'],floor:['地板或向下通道打不开','Floor or downward route is blocked','寻找下砸能力；它来自墓穴遗迹的千魂之墓。','Look for Slam, obtained from Tomb of 1000 Spirits in Tomb Ruins.','abilities.html#slam'],wall:['长直墙爬不上去','Cannot climb a tall wall','这是攀墙能力的回访标志。当前没有攀墙时先记录位置，继续主线。','This is a Wall Climb return point. Mark it and continue the story if the ability is missing.','abilities.html#wall-climb'],switch:['计时开关或瞬移机关','Timed switch or shift mechanism','需要位移箭；击败空中花园的逃跑植物后获得。','Requires Shift Arrows, obtained after Runaway Plant in Hanging Gardens.','abilities.html#shift-arrows'],cloud:['空中没有落脚点','No footing across an air gap','需要云朵箭；击败雨原的沼泽蛙后获得。','Requires Cloud Arrows, obtained after Swamp Frog in Rainy Plains.','abilities.html#cloud-shot'],barrier:['坚固障碍无法破坏','Reinforced obstacle will not break','需要蓄力攻击；在深坑击败失控机器人后获得。','Requires Charge Attack, obtained after Rogue Bot in The Pits.','abilities.html#charge-attack'],boss:['首领打不过','Boss is blocking progress','先打开对应首领详情，确认位置、攻击节奏和奖励。','Open the matching boss file for location, attack rhythm and reward.','boss-list.html'],upgrade:['永久升级找不全','Missing permanent upgrades','购买升级标记，并在天空之城检查各岛已获得/总数。','Buy Upgrade Markers and check each island’s found/total count in Sky City.','upgrade-list.html']};const ui={zh:{title:'卡关定位器',lead:'不用阅读一整篇泛泛建议。选择你当前所在阶段和眼前的问题，直接获得下一目标、所需能力与对应攻略。',top:'诊断方式',main:'2 个选择',sub:'定位流程阶段 + 障碍类型',formTitle:'告诉我你卡在哪里',formIntro:'选择最接近当前存档的情况。',stage:'当前所在阶段',problem:'眼前的问题',go:'给出下一步',stageDefault:'选择岛屿或阶段',problemDefault:'选择卡关类型',quick:'按障碍快速判断',notice:'提示：地图上的未探索出口比房间颜色更重要。购买升级标记后，它只会标出已经探索区域内的升级。',result:'诊断结果',current:'当前区域',target:'建议目标',need:'处理方法',guide:'打开对应攻略 →'},en:{title:'Route Locator',lead:'Skip generic advice. Select your current stage and obstacle to get a direct objective, required ability and matching guide.',top:'Diagnostic',main:'2 choices',sub:'Current stage + obstacle type',formTitle:'Where are you stuck?',formIntro:'Choose the closest match to your save.',stage:'Current stage',problem:'What blocks you?',go:'Show my next step',stageDefault:'Choose an island or stage',problemDefault:'Choose a problem',quick:'Diagnose by obstacle',notice:'Tip: unexplored map exits matter more than room color. Upgrade Markers only reveal upgrades in areas you have already explored.',result:'Result',current:'Current area',target:'Suggested objective',need:'What to do',guide:'Open matching guide →'}};let lang=localStorage.getItem('islets-language')||(navigator.language.toLowerCase().startsWith('zh')?'zh':'en');const $=s=>document.querySelector(s),btn=$('#lang');function setup(){const t=ui[lang],z=lang==='zh';document.documentElement.lang=z?'zh-CN':'en';document.body.classList.toggle('english',!z);btn.textContent=z?'中文':'EN';['title','lead'].forEach(x=>$('#'+x).textContent=t[x]);$('#statusTop').textContent=t.top;$('#statusMain').textContent=t.main;$('#statusSub').textContent=t.sub;$('#formTitle').textContent=t.formTitle;$('#formIntro').textContent=t.formIntro;$('#stageLabel').textContent=t.stage;$('#problemLabel').textContent=t.problem;$('#go').textContent=t.go;$('#quickTitle').textContent=t.quick;$('#notice').textContent=t.notice;$('#stage').innerHTML=`<option value="">${t.stageDefault}</option>`+Object.entries(stages).map(([k,v])=>`<option value="${k}">${z?v[0]:v[1]}</option>`).join('');$('#problem').innerHTML=`<option value="">${t.problemDefault}</option>`+Object.entries(problems).map(([k,v])=>`<option value="${k}">${z?v[0]:v[1]}</option>`).join('');$('#obstacles').innerHTML=Object.entries(problems).slice(1).map(([k,v])=>`<button class="obstacle" data-problem="${k}"><b>${z?v[0]:v[1]}</b><span>${z?v[2]:v[3]}</span></button>`).join('');$('#answer').className='answer empty';$('#answer').textContent=t.formIntro;localStorage.setItem('islets-language',lang)}function show(problemKey){const t=ui[lang],z=lang==='zh',s=stages[$('#stage').value],p=problems[problemKey];if(!p)return;$('#answer').className='answer';$('#answer').innerHTML=`<span class="result-tag">${t.result}</span><h2>${z?p[0]:p[1]}</h2><dl>${s?`<dt>${t.current}</dt><dd>${z?s[0]:s[1]}</dd><dt>${t.target}</dt><dd>${z?s[2]:s[3]}</dd>`:''}<dt>${t.need}</dt><dd>${z?p[2]:p[3]}</dd></dl><div class="links"><a href="${p[4]}">${t.guide}</a>${s?`<a href="${s[4]}">${z?'打开当前章节 →':'Open current chapter →'}</a>`:''}</div>`}$('#form').addEventListener('submit',e=>{e.preventDefault();show($('#problem').value)});$('#obstacles').addEventListener('click',e=>{const b=e.target.closest('[data-problem]');if(b){$('#problem').value=b.dataset.problem;show(b.data
